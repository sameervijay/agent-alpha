[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-alpha"
version = "0.1.0"
description = "PM-led multi-agent allocation pipeline with domain scouts and debate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv",
    "openpyxl",
    "yfinance",
    "requests",
    "feedparser",
    "finvizfinance",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-cli[inmem]>=0.2",
    "langgraph-sdk>=0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
